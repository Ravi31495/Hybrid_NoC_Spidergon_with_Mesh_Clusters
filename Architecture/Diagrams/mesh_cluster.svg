<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620"><rect width="1000" height="620" fill="#fff"/><style>.h{font:bold 28px Arial}.n{font:bold 18px Arial}.s{font:15px Arial}.box{fill:#eef4fb;stroke:#355c7d;stroke-width:2}.link{stroke:#68737d;stroke-width:2;fill:none}</style><text x="35" y="48" class="h">4×4 Mesh Cluster</text><text x="35" y="78" class="s">Sixteen routers form the local mesh. A gateway provides the connection to the global layer.</text><rect x="70" y="115" width="860" height="420" rx="16" class="box"/><g fill="#fff" stroke="#355c7d" stroke-width="2"> <rect x="130" y="155" width="120" height="52" rx="8"/><rect x="315" y="155" width="120" height="52" rx="8"/><rect x="500" y="155" width="120" height="52" rx="8"/><rect x="685" y="155" width="120" height="52" rx="8"/><rect x="130" y="240" width="120" height="52" rx="8"/><rect x="315" y="240" width="120" height="52" rx="8"/><rect x="500" y="240" width="120" height="52" rx="8"/><rect x="685" y="240" width="120" height="52" rx="8"/><rect x="130" y="325" width="120" height="52" rx="8"/><rect x="315" y="325" width="120" height="52" rx="8"/><rect x="500" y="325" width="120" height="52" rx="8"/><rect x="685" y="325" width="120" height="52" rx="8"/><rect x="130" y="410" width="120" height="52" rx="8"/><rect x="315" y="410" width="120" height="52" rx="8"/><rect x="500" y="410" width="120" height="52" rx="8"/><rect x="685" y="410" width="120" height="52" rx="8"/></g><g class="n"><text x="175" y="188">R0</text><text x="360" y="188">R1</text><text x="545" y="188">R2</text><text x="730" y="188">R3</text><text x="175" y="273">R4</text><text x="360" y="273">R5</text><text x="545" y="273">R6</text><text x="730" y="273">R7</text><text x="175" y="358">R8</text><text x="360" y="358">R9</text><text x="545" y="358">R10</text><text x="730" y="358">R11</text><text x="175" y="443">R12</text><text x="360" y="443">R13</text><text x="545" y="443">R14</text><text x="730" y="443">R15</text></g><g class="link"><path d="M25
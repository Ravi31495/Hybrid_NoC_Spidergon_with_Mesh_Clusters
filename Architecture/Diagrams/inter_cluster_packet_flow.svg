<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500"><rect width="1200" height="500" fill="#fff"/><style>.h{font:bold 28px Arial}.b{fill:#eef4fb;stroke:#355c7d;stroke-width:2}.g{fill:#e9f4ea;stroke:#4d7c52;stroke-width:2}.y{fill:#f7ead7;stroke:#9a6b2f;stroke-width:2}.s{font:16px Arial}.n{font:bold 17px Arial}.a{stroke:#68737d;stroke-width:3;fill:none}</style><text x="35" y="48" class="h">Inter-Cluster Packet Path</text><text x="35" y="78" class="s">The gateway separates local mesh forwarding from the global inter-cluster transfer.</text><rect x="45" y="170" width="180" height="90" rx="12" class="b"/><text x="88" y="205" class="n">Source router</text><text x="72" y="232" class="s">packet enters mesh</text><rect x="300" y="170" width="180" height="90" rx="12" class="b"/><text x="345" y="205" class="n">Local routing</text><text x="330" y="232" class="s">XY / adaptive</text><rect x="555" y="170" width="180" height="90" rx="12" class="y"/><text x="605" y="205" class="n">Gateway</text><text x="582" y="232" class="s">cluster boundary</text><rect x="810" y="170" width="180" height="90" rx="12" class="g"/><text x="858" y="205" class="n">Global layer</text><text x="840" y="232" class="s">Spidergon-inspired</text><rect x="1045" y="170" width="110" height="90" rx="12" class="b"/><text x="1060" y="205" class="n">Dest.</text><text x="1060" y="232" class="s">router</text><g class="a"><path d="M225 215L300 215M480 215L555 215M735 215L810 215M990 215L1045 215"/></g><text x="45" y="350" class="s">Packet fields: destination/source cluster, row and column, type, priority and payload.</text><text x="45" y="385" class="s">The architecture description specifies a fixed 48-bit packet with a 32-bit payload.</text></svg>
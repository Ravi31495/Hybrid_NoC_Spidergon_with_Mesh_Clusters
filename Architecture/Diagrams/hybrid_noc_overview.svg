<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#fff"/><style>.t{font-family:Arial,sans-serif;fill:#17202a}.h{font:bold 28px Arial}.s{font:16px Arial}.n{font:bold 18px Arial}.mesh{fill:#eef4fb;stroke:#355c7d;stroke-width:2}.g{stroke:#7b4b8a;stroke-width:4;fill:none}</style><text x="40" y="48" class="h">Hybrid NoC: 4 Mesh Clusters + Global Spidergon-Inspired Network</text><text x="40" y="78" class="s">Four 4×4 clusters form a 64-router system. Gateways connect the local meshes to the global layer.</text><ellipse cx="600" cy="385" rx="430" ry="245" class="g"/><text x="505" y="135" class="n">Global inter-cluster layer</text><g transform="translate(85,150)"><rect width="310" height="190" rx="12" class="mesh"/><text x="18" y="30" class="n">Cluster 0</text><text x="18" y="172" class="s">16 routers • 4×4 mesh • gateway</text></g><g transform="translate(805,150)"><rect width="310" height="190" rx="12" class="mesh"/><text x="18" y="30" class="n">Cluster 1</text><text x="18" y="172" class="s">16 routers • 4×4 mesh • gateway</text></g><g transform="translate(85,430)"><rect width="310" height="190" rx="12" class="mesh"/><text x="18" y="30" class="n">Cluster 2</text><text x="18" y="172" class="s">16 routers • 4×4 mesh • gateway</text></g><g transform="translate(805,430)"><rect width="310" height="190" rx="12" class="mesh"/><text x="18" y="30" class="n">Cluster 3</text><text x="18" y="172" class="s">16 routers • 4×4 mesh • gateway</text></g><path d="M395 245 C520 350 520 420 395 515" class="g"/><path d="M805 245 C680 350 680 420 805 515" class="g"/><path d="M375 300 C470 270 500 230 600 140 C700 230 730 270 825 300" class="g"/><path d="M375 460 C470 500 500 540 600 630 C700 540 730 500 825 460" class="g"/><text x="430" y="715" class="s">Local traffic stays in a mesh; inter-cluster traffic crosses a gateway and the global layer.</text></svg>
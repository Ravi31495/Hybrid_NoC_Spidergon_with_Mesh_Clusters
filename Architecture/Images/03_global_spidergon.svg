<rect x="500" y="205" width="200" height="42" rx="10" fill="#ccfbf1"/><text x="600" y="232" text-anchor="middle">Ring link</text>
<rect x="500" y="365" width="200" height="42" rx="10" fill="#ccfbf1"/><text x="600" y="392" text-anchor="middle">Opposite links</text>
</g>
<text x="600" y="700" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#475569">Illustrative logical topology; physical routing and port mapping are implementation-specific.</text>

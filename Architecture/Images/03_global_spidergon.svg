<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
<rect width="1200" height="800" fill="#f8fafc"/>
<text x="600" y="62" font-family="Arial,sans-serif" font-size="34" font-weight="700" text-anchor="middle" fill="#0f172a">Four-Cluster Spidergon-Inspired Global Layer</text>
<text x="600" y="98" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#475569">Ring links plus opposite-cluster links between gateways</text>
<g stroke="#0f766e" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M330 250 L870 250 L870 550 L330 550 Z"/>
<path d="M330 250 L870 550"/><path d="M870 250 L330 550"/>
</g>
<g fill="#dbeafe" stroke="#2563eb" stroke-width="4">
<rect x="230" y="190" width="200" height="120" rx="18"/><rect x="770" y="190" width="200" height="120" rx="18"/><rect x="230" y="490" width="200" height="120" rx="18"/><rect x="770" y="490" width="200" height="120" rx="18"/>
</g>
<g font-family="Arial,sans-serif" text-anchor="middle" fill="#1e3a8a"><text x="330" y="235" font-size="25" font-weight="700">GW0</text><text x="330" y="270" font-size="18">Cluster 0</text><text x="870" y="235" font-size="25" font-weight="700">GW1</text><text x="870" y="270" font-size="18">Cluster 1</text><text x="330" y="535" font-size="25" font-weight="700">GW3</text><text x="330" y="570" font-size="18">Cluster 3</text><text x="870" y="535" font-size="25" font-weight="700">GW2</text><text x="870" y="570" font-size="18">Cluster 2</text></g>
